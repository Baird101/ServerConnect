<!DOCTYPE html>

<html>

<body>

<h1 id="status">Ready</h1>

<button onclick="connect()">
    Connect
</button>

<script>

var currentRoom = "main";
var signalWindow = null;
var relayReady = false;

var RELAY =
    "https://baird101.github.io/ServerConnect/relay.html";

function openRelay(action) {

    var url = new URL(RELAY);

    url.searchParams.set("action", action);
    url.searchParams.set("room", currentRoom);

    var popupName =
        "chat-relay-" +
        Math.random().toString(36).substring(2);

    signalWindow = window.open(
        url.toString(),
        popupName,
        "width=420,height=320"
    );

    if(!signalWindow) {
        console.log("Popup blocked");
        return;
    }

    relayReady = false;
}

function closeRelay() {

    if(signalWindow && !signalWindow.closed) {
        signalWindow.close();
    }

    signalWindow = null;
    relayReady = false;
}

window.addEventListener("message", function(event) {

    var data = event.data;

    if(!data || data.type !== "relay_event") {
        return;
    }

    if(data.peerEvent === "relay_connected") {

        relayReady = true;

        console.log("Relay connected");

    }

    if(data.peerEvent === "webrtc_connected") {

        console.log("WebRTC connected");

    }

    if(data.peerEvent === "webrtc_message") {

        console.log(
            "WebRTC message:",
            data.message
        );

    }

});

openRelay("join");

</script>
</body>

</html>
