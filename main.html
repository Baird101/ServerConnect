<!DOCTYPE html>

<html>

<body>

<h1 id="status">Ready</h1>

<button onclick="connect()">
    Connect
</button>

<script>

var status = document.getElementById("status");

var relayWindow = null;

function connect() {

    relayWindow = window.open(
        "relay.html",
        "RelayWindow",
        "width=400,height=300"
    );

    if(relayWindow) {

        status.textContent =
            "Relay window opened";

    } else {

        status.textContent =
            "Popup blocked";

    }

}

</script>

</body>

</html>
